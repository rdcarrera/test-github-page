<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada</title>
  <!-- GitHub Pages sirve este fichero en cualquier ruta, por eso todo va en línea -->
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0d0d0c; color: #ecebe6;
           font: 16px/1.6 system-ui, sans-serif; text-align: center; padding: 24px; }
    h1 { font: 400 clamp(5rem, 20vw, 12rem)/1 Georgia, serif; margin: 0; letter-spacing: -.04em; }
    p { color: #a3a199; } a { color: #d4b483; }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>Esta imagen no está en el carrete.</p>
    <p><a id="home" href="/">Volver al inicio</a></p>
  </main>
  <script>
    // En páginas de proyecto (usuario.github.io/repo/) el inicio está en /repo/
    var seg = location.pathname.split("/")[1];
    var isProjectPage = /\.github\.io$/.test(location.hostname) && seg && location.hostname.split(".")[0] + ".github.io" !== seg;
    if (isProjectPage) document.getElementById("home").href = "/" + seg + "/";
  </script>
</body>
</html>
