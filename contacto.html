<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contacto</title>
  <meta name="description" content="Reserva una sesión o solicita presupuesto.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Manrope:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script type="module" src="assets/js/contact.js"></script>
</head>
<body class="page-contact">
  <header class="site-header"></header>

  <main class="section contact">
    <div class="contact__intro" data-reveal>
      <p class="eyebrow">Contacto</p>
      <h1 class="contact__title">Cuéntame tu <em>proyecto</em></h1>
      <p class="contact__lead">Bodas, retratos, campañas o editoriales. Escríbeme con la fecha y la idea, y te enviaré una propuesta a medida.</p>
      <div class="contact-info"></div>
    </div>

    <form class="contact-form" novalidate data-reveal>
      <div class="field">
        <input id="name" name="name" type="text" placeholder=" " required autocomplete="name">
        <label for="name">Nombre</label>
      </div>
      <div class="field">
        <input id="email" name="email" type="email" placeholder=" " required autocomplete="email">
        <label for="email">Email</label>
      </div>
      <div class="field-row">
        <div class="field">
          <select id="service" name="service" required>
            <option value="" disabled selected hidden></option>
          </select>
          <label for="service">Tipo de proyecto</label>
        </div>
        <div class="field">
          <input id="date" name="date" type="date" placeholder=" ">
          <label for="date">Fecha (opcional)</label>
        </div>
      </div>
      <div class="field">
        <textarea id="message" name="message" rows="5" placeholder=" " required minlength="10"></textarea>
        <label for="message">Mensaje</label>
      </div>
      <input type="text" name="_gotcha" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button class="btn btn--accent" type="submit">Enviar mensaje <span aria-hidden="true">→</span></button>
      <p class="form-status" role="status" aria-live="polite"></p>
    </form>
  </main>

  <footer class="site-footer"></footer>
</body>
</html>
